name: healthymeal-dev

services:
  frontend:
    image: healthymeal-dev-frontend:latest
    build:
      context: .
      dockerfile: Frontend/Dockerfile
      target: build
      args:
        VITE_APP_ENV: development
        VITE_API_BASE_URL: http://localhost:5299/api
        VITE_ENABLE_DEBUG_TOOLS: ${VITE_ENABLE_DEBUG_TOOLS:-true}
        VITE_ENABLE_ANALYTICS: ${VITE_ENABLE_ANALYTICS:-false}
        VITE_ENABLE_EXPERIMENTAL_REPORTS: ${VITE_ENABLE_EXPERIMENTAL_REPORTS:-false}
        VITE_GENERATE_SOURCEMAP: ${VITE_GENERATE_SOURCEMAP:-false}
        VITE_SENTRY_DSN: ${SENTRY_DSN:-}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        VITE_ENABLE_TRACING: ${VITE_ENABLE_TRACING:-true}
    command: ["sh", "-c", "cd Frontend && npm run dev -- --host 0.0.0.0 --port 5173"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_APP_ENV: development
      VITE_API_BASE_URL: http://localhost:5299/api
      VITE_DEV_API_PROXY_TARGET: http://backend:8080
      VITE_DEV_SERVER_PORT: 5173
      VITE_ENABLE_DEBUG_TOOLS: ${VITE_ENABLE_DEBUG_TOOLS:-true}
      VITE_ENABLE_ANALYTICS: ${VITE_ENABLE_ANALYTICS:-false}
      VITE_ENABLE_EXPERIMENTAL_REPORTS: ${VITE_ENABLE_EXPERIMENTAL_REPORTS:-false}
      VITE_GENERATE_SOURCEMAP: ${VITE_GENERATE_SOURCEMAP:-false}
      VITE_SENTRY_DSN: ${SENTRY_DSN:-}
      VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      VITE_ENABLE_TRACING: ${VITE_ENABLE_TRACING:-true}
      CHOKIDAR_USEPOLLING: true
    volumes:
      - ./Frontend:/app/Frontend
      - frontend-node-modules:/app/Frontend/node_modules
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - edge

  backend:
    image: healthymeal-dev-backend:latest
    build:
      context: .
      dockerfile: Backend/Dockerfile
      target: runtime
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__DefaultConnection: Server=${DB_HOST:-database};Port=3306;Database=${DB_NAME:-healthymeal};Uid=${DB_USER:-healthymeal};Pwd=${DB_PASSWORD:-CHANGE_ME_DB_PASSWORD};SslMode=None;AllowPublicKeyRetrieval=True;Connection Timeout=15;Default Command Timeout=30;
      Jwt__Key: ${JWT_KEY:-CHANGE_ME_JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-HealthyMealIssuer}
      Jwt__Audience: ${JWT_AUDIENCE:-HealthyMealAudience}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      Jwt__AccessTokenExpiryMinutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      Jwt__RefreshTokenExpiryDays: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-14}
      Jwt__RefreshTokenCookieName: ${JWT_REFRESH_TOKEN_COOKIE_NAME:-hm_refresh_token}
      Jwt__RefreshTokenCookieSecure: ${JWT_REFRESH_TOKEN_COOKIE_SECURE:-false}
      USDA_API_KEY: ${USDA_API_KEY:-}
      FATSECRET_CLIENT_ID: ${FATSECRET_CLIENT_ID:-}
      FATSECRET_CLIENT_SECRET: ${FATSECRET_CLIENT_SECRET:-}
      Observability__EnableTracing: ${VITE_ENABLE_TRACING:-true}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: 3306
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
      RUN_DB_WAIT: true
      EnableHttpsRedirection: false
    ports:
      - "${BACKEND_PORT:-5299}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready | grep -q Healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - edge
      - data

  database:
    image: mariadb:10.4.32
    environment:
      MARIADB_DATABASE: ${DB_NAME:-healthymeal}
      MARIADB_USER: ${DB_USER:-healthymeal}
      MARIADB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-CHANGE_ME_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PUBLIC_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p${DB_ROOT_PASSWORD:-CHANGE_ME_DB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - data

volumes:
  db-data:
  frontend-node-modules:

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
