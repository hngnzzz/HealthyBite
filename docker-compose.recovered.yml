services:
  frontend:
    image: healthymeal-frontend:latest
    container_name: healthymeal-frontend-1
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_SENTRY_RELEASE: ""
      APP_ENABLE_TRACING: "false"
      APP_ENV: production
      APP_API_BASE_URL: /api
      APP_SENTRY_DSN: ""
      APP_ENABLE_ANALYTICS: "false"
      APP_ENABLE_DEBUG_TOOLS: "false"
      APP_ENABLE_EXPERIMENTAL_REPORTS: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge

  backend:
    image: healthymeal-backend:latest
    container_name: healthymeal-backend-1
    restart: unless-stopped
    environment:
      USDA_API_KEY: ""
      ApiSecurity__AllowedOrigins__0: http://localhost:8080
      ConnectionStrings__DefaultConnection: Server=database;Port=3306;Database=nutrition_app;Uid=healthymeal;Pwd=healthymeal_password;SslMode=None;AllowPublicKeyRetrieval=True;Connection Timeout=15;Default Command Timeout=30;
      EnableHttpsRedirection: "false"
      FATSECRET_CLIENT_ID: ""
      Observability__EnableTracing: "false"
      Jwt__Audience: HealthyMealAudience
      Jwt__RefreshTokenCookieSecure: "true"
      Jwt__Key: d8SApwgd8Kjt9NKJxyIVPoQsPO/CzGAbKqueNfUexoGIrAfQ1sPEV5HU3tFwr/Fv
      FATSECRET_CLIENT_SECRET: ""
      Jwt__RefreshTokenExpiryDays: "14"
      DB_PORT: "3306"
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Issuer: HealthyMealIssuer
      Jwt__AccessTokenExpiryMinutes: "15"
      RUN_DB_WAIT: "true"
      Jwt__ExpiryMinutes: "60"
      Jwt__RefreshTokenCookieName: hm_refresh_token
      DB_HOST: database
      DB_WAIT_TIMEOUT: "60"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health/ready | grep -q Healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data
      - edge

  database:
    image: mariadb:10.4.32
    container_name: healthymeal-database-1
    restart: unless-stopped
    environment:
      MARIADB_PASSWORD: healthymeal_password
      MARIADB_ROOT_PASSWORD: xcJb5hc7snQoyKFXdy/v5JPLpwQRi1an
      MARIADB_DATABASE: nutrition_app
      MARIADB_USER: healthymeal
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - healthymeal_db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -pxcJb5hc7snQoyKFXdy/v5JPLpwQRi1an --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data

volumes:
  healthymeal_db-data:
    external: true
    name: healthymeal_db-data

networks:
  edge:
    external: true
    name: healthymeal_edge
  data:
    external: true
    name: healthymeal_data
